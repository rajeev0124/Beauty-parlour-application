# Render.com deployment configuration
# Backend NestJS API deployment with production optimizations

services:
  - type: web
    name: beauty-parlour-api
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    healthCheckInterval: 30
    preDeployCommand: npm run build
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: MONGODB_URI
        sync: false  # Set manually in Render dashboard
      - key: JWT_SECRET
        sync: false  # Set manually in Render dashboard
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_REFRESH_SECRET
        sync: false  # Set manually in Render dashboard
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: CORS_ORIGINS
        value: https://beauty-parlour-0124.web.app,https://beauty-parlour-0124.firebaseapp.com,https://beauty-parlour-application.onrender.com
      - key: RAZORPAY_KEY
        sync: false  # Set manually in Render dashboard
      - key: RAZORPAY_SECRET
        sync: false  # Set manually in Render dashboard
      - key: LOG_LEVEL
        value: info
