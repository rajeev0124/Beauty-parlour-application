<div class="dialog-shell">
  <div class="dialog-icon-wrapper" [ngClass]="data.type || 'danger'">
    <div class="dialog-icon-circle">
      <mat-icon>{{ iconMap[data.type || 'danger'] }}</mat-icon>
    </div>
    <div class="dialog-icon-pulse"></div>
  </div>
  
  <div class="dialog-content">
    <h2 class="dialog-title">{{ data.title }}</h2>
    <p class="dialog-message">{{ data.message }}</p>
  </div>
  
  <div class="dialog-actions">
    <button class="dialog-btn dialog-btn-secondary" [disabled]="isClosing" (click)="closeDialog(false)">
      <mat-icon>close</mat-icon>
      {{ data.cancelText || 'Cancel' }}
    </button>
    <button class="dialog-btn dialog-btn-primary" [ngClass]="data.type || 'danger'" [disabled]="isClosing" (click)="closeDialog(true)">
      <mat-icon>check</mat-icon>
      {{ data.confirmText || 'Confirm' }}
    </button>
  </div>
</div>
